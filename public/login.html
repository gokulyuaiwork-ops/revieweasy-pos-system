<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewEasy | Unified Authentication Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      font-size: 36px;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
      color: #ffffff;
    }
    .login-header h2 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
    }
    .form-field input {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
      background: #ffffff;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
      transition: all 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
    }
    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .demo-accounts p {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      text-align: center;
    }
    .demo-pills {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .demo-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
    }
    .demo-pill:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .pill-info strong {
      font-size: 12px;
      display: block;
      color: #0f172a;
    }
    .pill-info span {
      font-size: 11px;
      color: var(--text-sub);
    }
    .pill-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-admin { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }
    .badge-client { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .login-error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #e11d48;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⭐</div>
        <h2>ReviewEasy Portal</h2>
        <p>Unified Login for Admins & Client Merchants</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-field">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="admin@revieweasy.com or store@cafe.com">
        </div>

        <div class="form-field">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login" id="btnLogin">Sign In ➔</button>
      </form>

      <!-- Quick 1-Click Demo Accounts -->
      <div class="demo-accounts">
        <p>⚡ 1-Click Test Credentials</p>
        <div class="demo-pills">
          <div class="demo-pill" onclick="fillCredentials('admin@revieweasy.com', 'admin123')">
            <div class="pill-info">
              <strong>👑 SaaS Admin Portal</strong>
              <span>admin@revieweasy.com / admin123</span>
            </div>
            <span class="pill-badge badge-admin">Admin</span>
          </div>

          <div class="demo-pill" onclick="fillCredentials('client@sunshine.com', 'client123')">
            <div class="pill-info">
              <strong>🏪 Sunshine Cafe (Merchant)</strong>
              <span>client@sunshine.com / client123</span>
            </div>
            <span class="pill-badge badge-client">Client</span>
          </div>

          <div class="demo-pill" onclick="fillCredentials('client@bluetokai.com', 'client123')">
            <div class="pill-info">
              <strong>☕ Blue Tokai (Merchant)</strong>
              <span>client@bluetokai.com / client123</span>
            </div>
            <span class="pill-badge badge-client">Client</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('loginError').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      btn.innerText = 'Verifying...';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          // Store session in localStorage
          localStorage.setItem('revieweasy_user', JSON.stringify(data.user));
          window.location.href = data.redirectUrl;
        } else {
          errorDiv.innerText = data.error || 'Invalid credentials';
          errorDiv.style.display = 'block';
          btn.innerText = 'Sign In ➔';
        }
      } catch (err) {
        errorDiv.innerText = 'Connection error: ' + err.message;
        errorDiv.style.display = 'block';
        btn.innerText = 'Sign In ➔';
      }
    }
  </script>
</body>
</html>
