<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewEasy | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--glass-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--glass-shadow-lg);
      animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff9500, #ff5e3a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      margin: 0 auto 14px;
      box-shadow: 0 4px 16px rgba(255, 149, 0, 0.35);
    }
    .login-header h2 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 500;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-field input {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .form-field input:focus {
      background: #ffffff;
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      font-size: 13.5px;
      font-weight: 700;
      background: var(--apple-blue);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }
    .btn-login:hover {
      background: #0077ed;
      transform: translateY(-0.5px);
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.4);
    }
    .demo-accounts {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }
    .demo-accounts p {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: center;
    }
    .demo-pills {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .demo-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-pill:hover {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.1);
      transform: translateY(-0.5px);
    }
    .pill-info strong {
      font-size: 12px;
      display: block;
      color: var(--text-main);
    }
    .pill-info span {
      font-size: 10.5px;
      color: var(--text-sub);
      font-family: 'JetBrains Mono', monospace;
    }
    .pill-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
    }
    .badge-admin { background: #f4eefb; color: #893cc5; }
    .badge-client { background: #e1f8eb; color: #1b873f; }
    .login-error {
      background: #feecee;
      color: #d70015;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      text-align: center;
      display: none;
      margin-bottom: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">★</div>
        <h2>ReviewEasy</h2>
        <p>Terminal & Dashboard Portal</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-field">
          <label>Store ID or Email</label>
          <input type="text" id="email" required placeholder="admin@revieweasy.com or STORE_DEMO_01">
        </div>

        <div class="form-field">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login" id="btnLogin">Sign In ➔</button>
      </form>

      <!-- 1-Click Fast Credentials -->
      <div class="demo-accounts">
        <p>⚡ Quick Test Credentials</p>
        <div class="demo-pills">
          <div class="demo-pill" onclick="fillCredentials('admin@revieweasy.com', 'admin123')">
            <div class="pill-info">
              <strong>👑 SaaS Admin Portal</strong>
              <span>admin@revieweasy.com</span>
            </div>
            <span class="pill-badge badge-admin">Admin</span>
          </div>

          <div class="demo-pill" onclick="fillCredentials('client@sunshine.com', 'client123')">
            <div class="pill-info">
              <strong>🏪 Sunshine Cafe (Merchant)</strong>
              <span>client@sunshine.com</span>
            </div>
            <span class="pill-badge badge-client">Merchant</span>
          </div>

          <div class="demo-pill" onclick="fillCredentials('client@bluetokai.com', 'client123')">
            <div class="pill-info">
              <strong>☕ Blue Tokai (Merchant)</strong>
              <span>client@bluetokai.com</span>
            </div>
            <span class="pill-badge badge-client">Merchant</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const userJson = localStorage.getItem('revieweasy_user');
      if (userJson) {
        try {
          const user = JSON.parse(userJson);
          if (user && user.id) {
            window.location.href = user.role === 'ADMIN' ? '/admin.html' : '/index.html';
          }
        } catch (e) {}
      }
    });

    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('loginError').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      btn.innerText = 'Verifying...';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('revieweasy_user', JSON.stringify(data.user));
          window.location.href = data.redirectUrl;
        } else {
          errorDiv.innerText = data.error || 'Invalid credentials';
          errorDiv.style.display = 'block';
          btn.innerText = 'Sign In ➔';
        }
      } catch (err) {
        errorDiv.innerText = 'Connection error: ' + err.message;
        errorDiv.style.display = 'block';
        btn.innerText = 'Sign In ➔';
      }
    }
  </script>
</body>
</html>
